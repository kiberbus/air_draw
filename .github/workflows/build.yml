name: Build

# Builds standalone executables for Windows, macOS and Linux.
# - Every push / PR: binaries are uploaded as workflow artifacts.
# - Pushing a tag like v1.0.0: a GitHub Release is created with all binaries attached.

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
          - os: macos-latest
            name: macos-arm64
          - os: ubuntu-22.04
            name: linux-x64

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build with PyInstaller
      run: pyinstaller air_draw.spec --clean --noconfirm

    - name: Package (Windows)
      if: runner.os == 'Windows'
      shell: bash
      run: |
        mkdir release
        cp dist/AirDraw.exe release/AirDraw-${{ matrix.name }}.exe

    - name: Package (macOS)
      if: runner.os == 'macOS'
      run: |
        mkdir release
        ditto -c -k --keepParent dist/AirDraw.app release/AirDraw-${{ matrix.name }}.zip

    - name: Package (Linux)
      if: runner.os == 'Linux'
      run: |
        mkdir release
        tar -czf release/AirDraw-${{ matrix.name }}.tar.gz -C dist AirDraw

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: AirDraw-${{ matrix.name }}
        path: release/*

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: release
        merge-multiple: true

    - name: Create release
      uses: softprops/action-gh-release@v2
      with:
        files: release/*
        generate_release_notes: true
