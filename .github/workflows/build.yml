name: Build

# Lints and tests on Linux first, then builds standalone executables for Windows, macOS and Linux.
# - Every push / PR: binaries are uploaded as workflow artifacts.
# - Pushing a tag like v1.0.0: a GitHub Release is created with all binaries attached.

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Lint and test (linux-x64)
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install Qt system libraries (headless)
      run: |
        sudo apt-get update
        sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1 libglib2.0-0

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt -r requirements-dev.txt

    - name: Lint
      run: ruff check .

    - name: Unit tests
      env:
        QT_QPA_PLATFORM: offscreen
      run: pytest tests/test_air_draw.py -v

    - name: End-to-end smoke test
      env:
        QT_QPA_PLATFORM: offscreen
      run: python -m tests.verify_full

  build:
    name: Build (${{ matrix.name }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
          - os: macos-latest
            name: macos-arm64
          - os: ubuntu-22.04
            name: linux-x64

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build with PyInstaller
      env:
        AIR_DRAW_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
      run: pyinstaller air_draw.spec --clean --noconfirm

    - name: Package (Windows)
      if: runner.os == 'Windows'
      shell: bash
      run: |
        mkdir release
        cp dist/AirDraw.exe release/AirDraw-${{ matrix.name }}.exe

    - name: Package (macOS)
      if: runner.os == 'macOS'
      run: |
        mkdir release
        ditto -c -k --keepParent dist/AirDraw.app release/AirDraw-${{ matrix.name }}.zip

    - name: Package (Linux)
      if: runner.os == 'Linux'
      run: |
        mkdir release
        tar -czf release/AirDraw-${{ matrix.name }}.tar.gz -C dist AirDraw

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: AirDraw-${{ matrix.name }}
        path: release/*

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: release
        merge-multiple: true

    - name: Create release
      uses: softprops/action-gh-release@v2
      with:
        files: release/*
        generate_release_notes: true
